services:
  ito:
    build:
      context: .
      args:
        # 版の確認用 (scripts/deploy.sh が渡す)
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      # ホスト側のポート。公開用は HOST_PORT=47214。コンテナ内の待受 (47213) は変えない
      - "${HOST_PORT:-47213}:47213"
    environment:
      # AIお題用の ASK API。値は compose.yaml と同じ場所の .env に書く (git 管理外)
      ASK_API_URL: ${ASK_API_URL:-}
      ASK_API_KEY: ${ASK_API_KEY:-}
      ASK_PROJECT_ID: ${ASK_PROJECT_ID:-}
      ASK_MODEL: ${ASK_MODEL:-}
      # 10の扉のAI GM用のモデル。未設定なら gpt-6-luna-thinking
      DOORS_MODEL: ${DOORS_MODEL:-}
    restart: unless-stopped
