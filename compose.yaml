services:
  ito:
    build: .
    ports:
      - "47213:47213"
    environment:
      # AIお題用の ASK API。値は compose.yaml と同じ場所の .env に書く (git 管理外)
      ASK_API_URL: ${ASK_API_URL:-}
      ASK_API_KEY: ${ASK_API_KEY:-}
      ASK_PROJECT_ID: ${ASK_PROJECT_ID:-}
      ASK_MODEL: ${ASK_MODEL:-}
    restart: unless-stopped
